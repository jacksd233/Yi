<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>周易互动学习</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="app">
      <header class="hero">
        <p class="hero-tag">Interactive Yi</p>
        <h1 id="hexagram-title">周易互动学习</h1>
        <p id="hexagram-meta" class="hero-meta"></p>  
        <a href="#about-author" class="hero-link">关于作者</a>
      </header>

      <section class="layout">
        <aside class="control-panel" aria-label="卦象交互面板">
          <div class="line-area">
            <div id="line-list" class="line-list"></div>
          </div>

          <div class="trigram-summary">
            <div class="trigram-card">
              <span class="trigram-label">上卦</span>
              <strong id="upper-trigram-name"></strong>
              <span id="upper-trigram-symbol" class="trigram-symbol"></span>
            </div>
            <div class="trigram-card">
              <span class="trigram-label">下卦</span>
              <strong id="lower-trigram-name"></strong>
              <span id="lower-trigram-symbol" class="trigram-symbol"></span>
            </div>
          </div>

          <div class="change-line">
            <p class="section-title">变爻（单选）</p>
            <div id="change-line-buttons" class="change-line-buttons"></div>
          </div>

          <div class="control-actions">
            <button id="reset-btn" type="button" class="action-btn">重置为乾卦</button>
            <button id="random-btn" type="button" class="action-btn alt">随机起卦</button>
          </div>
        </aside>

        <section class="info-panel" aria-label="卦象信息面板">
          <article id="current-hexagram-panel" class="hexagram-panel"></article>
          <article id="changed-hexagram-panel" class="hexagram-panel changed hidden"></article>
        </section>
      </section>

      <section class="nav-panel" aria-label="六十四卦快捷导航">
        <div class="nav-head">
          <h2>六十四卦导航</h2>
          <p>点击编号或缩略卦象快速切换</p>
        </div>
        <div id="hexagram-nav" class="hexagram-nav"></div>
      </section>

      <section id="about-author" class="about-panel" aria-label="作者信息与联系方式">
        <div class="about-head">
          <h2>关于作者</h2>
          <p>晚来天欲雪,能饮一杯无?</p>
        </div>
        <div class="about-grid">
          <article class="about-card intro">
            <h3>个人简介</h3>
            <p>
              你好，我是 <strong>jacksd</strong>，正在尝试周易学习与现代化表达。
              这个网页希望帮助更多人通过交互方式理解卦象与爻辞。
            </p>
            <p class="muted">兴趣所向</p>
          </article>
          <article class="about-card contact">
            <h3>联系方式</h3>
            <ul class="contact-list">
              <li>
                <span class="k">邮箱</span>
                <a href="mailto:yourname@example.com">jacksd233@gmail.com</a>
              </li>
              <li>
                <span class="k">GitHub</span>
                <a href="https://github.com/yourname" target="_blank" rel="noreferrer">github.com/jacksd233</a>
              </li>
              <li>
                <span class="k">个人网站</span>
                <a href="https://your-site.example" target="_blank" rel="noreferrer">Not Yet</a>
              </li>
            </ul>
            <p class="muted">to be continued</p>
          </article>
        </div>
      </section>
    </main>

    <script src="./hexagram-originals.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
